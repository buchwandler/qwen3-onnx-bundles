name: refresh-catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"
permissions:
  contents: read
jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "MVP refresh is review-only. Resolve current upstream SHAs, update catalog/source JSON,"
          echo "then materialize per-file hashes before promoting a production catalog release."
          python scripts/verify_catalog.py
